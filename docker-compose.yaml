version: '3.8'

services:
  # THE MANAGER: Jenkins Controller
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins_server
    restart: always
    user: root
    environment:
      - CASC_JENKINS_CONFIG=/var/jenkins_home/jenkins.yaml
    ports:
      - "50000:50000"
    volumes:
      - "C:/Users/TIAA User/Jenkins_new:/var/jenkins_home"
      - ./jenkins.yaml:/var/jenkins_home/jenkins.yaml:ro
      - ./jenkins_key:/var/jenkins_home/jenkins_key:ro
    networks:
      - jenkins-net

  # THE RECEPTIONIST: Nginx Reverse Proxy
  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./jenkins.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - jenkins
    networks:
      - jenkins-net

  # THE WORKERS: 3 Identical Build Agents
  worker-1: &worker_base
    build: 
      context: .
      dockerfile: Dockerfile.agent
    restart: always
    networks:
      - jenkins-net

  worker-2:
    <<: *worker_base
    container_name: worker-2

  worker-3:
    <<: *worker_base
    container_name: worker-3

networks:
  jenkins-net:
    driver: bridge