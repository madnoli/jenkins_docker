jenkins:
  nodes:
    - permanent:
        name: "worker-1"
        remoteFS: "/home/jenkins"
        launcher:
          ssh:
            host: "worker-1"
            port: 22
            credentialsId: "worker-ssh-key"
            sshHostKeyVerificationStrategy: "nonVerifyingKeyVerificationStrategy"
    - permanent:
        name: "worker-2"
        remoteFS: "/home/jenkins"
        launcher:
          ssh:
            host: "worker-2"
            port: 22
            credentialsId: "worker-ssh-key"
            sshHostKeyVerificationStrategy: "nonVerifyingKeyVerificationStrategy"
    - permanent:
        name: "worker-3"
        remoteFS: "/home/jenkins"
        launcher:
          ssh:
            host: "worker-3"
            port: 22
            credentialsId: "worker-ssh-key"
            sshHostKeyVerificationStrategy: "nonVerifyingKeyVerificationStrategy"